services:
  daa-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      - PORT=3000
      # Required: Postgres DB URL for auth + store persistence.
      - DAA_DB_URL=postgresql://daa:daa@postgres:5432/daa
      # Supabase Auth
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=daa
      - POSTGRES_PASSWORD=daa
      - POSTGRES_DB=daa
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - daa-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  daa-postgres-data:
