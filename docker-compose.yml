services:
  daa-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      # Required: Postgres DB URL for auth + store persistence.
      - DAA_DB_URL=postgresql://daa:daa@postgres:5432/daa
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_SECRETS_ENCRYPTION_KEY=${DAA_SECRETS_ENCRYPTION_KEY}
      # LLM runtime（支持 OpenAI / 代理 Responses API）
      - DAA_LLM_ENDPOINT=${DAA_LLM_ENDPOINT:-}
      - DAA_LLM_MODEL=${DAA_LLM_MODEL:-}
      - DAA_OPENAI_API_KEY=${DAA_OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Embedding (SiliconFlow / DeepSeek / OpenAI)
      - DAA_EMBEDDING_PROVIDER=${DAA_EMBEDDING_PROVIDER:-}
      - DAA_EMBEDDING_API_KEY=${DAA_EMBEDDING_API_KEY:-}
      - DAA_EMBEDDING_ENDPOINT=${DAA_EMBEDDING_ENDPOINT:-}
      - DAA_EMBEDDING_MODEL=${DAA_EMBEDDING_MODEL:-}
      # Alpaca (US news 主源 — REST 降级 + WS 实时推送共用同一账号密钥)
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  daa-ws-news:
    # Alpaca News WebSocket 常驻守护，实时接收 news → POST 到 daa-web
    # 复用 daa-web 镜像（已含 ws 依赖），仅换 entrypoint。
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - daa-web
    environment:
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-}
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_WEB_BASE_URL=http://daa-web:3000
    command: ["node", "scripts/alpacaWsNewsDaemon.mjs"]
    restart: unless-stopped

  ollama:
    # 本地 embedding 模型（BGE-M3, 1024 维，与 pgvector schema 对齐）
    # 首次启动后需要 `docker exec daa-ollama ollama pull bge-m3`
    # 或使用下方 ollama-init 服务自动拉取。
    image: ollama/ollama:latest
    container_name: daa-ollama
    restart: unless-stopped
    volumes:
      - daa-ollama-data:/root/.ollama
    # 内部通信用，不暴露到宿主外
    expose:
      - "11434"

  ollama-init:
    # 一次性服务：等待 ollama ready 后 pull bge-m3 模型
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do
         echo 'waiting for ollama...' && sleep 2;
       done;
       OLLAMA_HOST=http://ollama:11434 ollama pull bge-m3 && echo 'bge-m3 ready'"
    restart: "no"

  daa-cron:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - daa-web
    environment:
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl
        {
          printf '%s\n' '*/15 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/price-refresh'
          printf '%s\n' '5 0 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/fx-refresh'
          printf '%s\n' '25 0 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/fundamentals-refresh'
          printf '%s\n' '*/30 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/news-refresh'
          printf '%s\n' '*/30 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/market-indicators-refresh'
          printf '%s\n' '20 0 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/cache-cleanup'
          printf '%s\n' '0 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/daily-analysis'
          printf '%s\n' '0 1,9 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/drift-check'
          printf '%s\n' '0 8 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/hf-ingest'
          printf '%s\n' '30 1 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/dividend-refresh'
          printf '%s\n' '10,40 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/health-check'
          printf '%s\n' '0 * * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/cognitive-agent'
          printf '%s\n' '40 3 * * * curl -sf -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" http://daa-web:3000/api/daa/cron/entity-backfill'
        } > /etc/crontabs/root
        crond -f -L /dev/stdout

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=daa
      - POSTGRES_PASSWORD=daa
      - POSTGRES_DB=daa
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - daa-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  daa-postgres-data:
  daa-ollama-data:
