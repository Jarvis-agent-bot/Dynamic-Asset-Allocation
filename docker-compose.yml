services:
  daa-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      - PORT=3000
      # Required: Postgres DB URL for auth + store persistence.
      - DAA_DB_URL=postgresql://daa:daa@postgres:5432/daa
      # Supabase Auth
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_SECRETS_ENCRYPTION_KEY=${DAA_SECRETS_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  daa-cron:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - daa-web
    environment:
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
    entrypoint: >
      sh -c "
        apk add --no-cache curl &&
        echo '*/15 * * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/price-refresh' >> /etc/crontabs/root &&
        echo '5 0 * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/fx-refresh' >> /etc/crontabs/root &&
        echo '*/30 * * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/news-refresh' >> /etc/crontabs/root &&
        echo '*/30 * * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/market-indicators-refresh' >> /etc/crontabs/root &&
        echo '20 0 * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/cache-cleanup' >> /etc/crontabs/root &&
        echo '0 * * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/daily-analysis' >> /etc/crontabs/root &&
        echo '0 1,9 * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/drift-check' >> /etc/crontabs/root &&
        echo '0 8 * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/hf-ingest' >> /etc/crontabs/root &&
        echo '30 1 * * * curl -sf -X POST -H \"x-daa-cron-token: $$DAA_CRON_TOKEN\" http://daa-web:3000/api/daa/cron/dividend-refresh' >> /etc/crontabs/root &&
        crond -f -L /dev/stdout
      "

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=daa
      - POSTGRES_PASSWORD=daa
      - POSTGRES_DB=daa
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - daa-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  daa-postgres-data:
