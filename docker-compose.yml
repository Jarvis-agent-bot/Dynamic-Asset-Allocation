services:
  daa-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      # Required: Postgres DB URL for auth + store persistence.
      - DAA_DB_URL=postgresql://daa:daa@postgres:5432/daa
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_SECRETS_ENCRYPTION_KEY=${DAA_SECRETS_ENCRYPTION_KEY}
      # LLM runtime（支持 OpenAI / 代理 Responses API）
      - DAA_LLM_ENDPOINT=${DAA_LLM_ENDPOINT:-}
      - DAA_LLM_MODEL=${DAA_LLM_MODEL:-}
      - DAA_OPENAI_API_KEY=${DAA_OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Embedding (SiliconFlow / DeepSeek / OpenAI)
      - DAA_EMBEDDING_PROVIDER=${DAA_EMBEDDING_PROVIDER:-}
      - DAA_EMBEDDING_API_KEY=${DAA_EMBEDDING_API_KEY:-}
      - DAA_EMBEDDING_ENDPOINT=${DAA_EMBEDDING_ENDPOINT:-}
      - DAA_EMBEDDING_MODEL=${DAA_EMBEDDING_MODEL:-}
      # Alpaca (US news 主源 — REST 降级 + WS 实时推送共用同一账号密钥)
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  daa-ws-news:
    # Alpaca News WebSocket 常驻守护，实时接收 news → POST 到 daa-web
    # 复用 daa-web 镜像（已含 ws 依赖），仅换 entrypoint。
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - daa-web
    environment:
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID:-}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY:-}
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_WEB_BASE_URL=http://daa-web:3000
    command: ["node", "scripts/alpacaWsNewsDaemon.mjs"]
    restart: unless-stopped

  ollama:
    # 本地 embedding 模型（BGE-M3, 1024 维，与 pgvector schema 对齐）
    # 首次启动后需要 `docker exec daa-ollama ollama pull bge-m3`
    # 或使用下方 ollama-init 服务自动拉取。
    image: ollama/ollama:latest
    container_name: daa-ollama
    restart: unless-stopped
    volumes:
      - daa-ollama-data:/root/.ollama
    # 内部通信用，不暴露到宿主外
    expose:
      - "11434"

  ollama-init:
    # 一次性服务：等待 ollama ready 后 pull bge-m3 模型
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do
         echo 'waiting for ollama...' && sleep 2;
       done;
       OLLAMA_HOST=http://ollama:11434 ollama pull bge-m3 && echo 'bge-m3 ready'"
    restart: "no"

  daa-cron:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - daa-web
    environment:
      - DAA_CRON_TOKEN=${DAA_CRON_TOKEN}
      - DAA_WEB_BASE_URL=http://daa-web:3000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl
        cat >/usr/local/bin/daa-cron-curl <<'SH'
        #!/bin/sh
        set +e

        endpoint="$$1"
        if [ -z "$$endpoint" ]; then
          echo "daa-cron endpoint=missing status=000 duration_ms=0 error=missing_endpoint"
          exit 2
        fi

        base_url="$${DAA_WEB_BASE_URL:-http://daa-web:3000}"
        body_file="$$(mktemp)"
        started_at="$$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        start_s="$$(date +%s)"

        status="$$(curl -sS -o "$$body_file" -w "%{http_code}" -X POST -H "x-daa-cron-token: $$DAA_CRON_TOKEN" "$$base_url$$endpoint")"
        curl_exit="$$?"
        end_s="$$(date +%s)"
        duration_ms="$$(( (end_s - start_s) * 1000 ))"

        if [ "$$curl_exit" -ne 0 ]; then
          echo "daa-cron endpoint=$$endpoint status=000 duration_ms=$$duration_ms started_at=$$started_at error=curl_exit_$$curl_exit"
          rm -f "$$body_file"
          exit "$$curl_exit"
        fi

        if [ "$$status" -ge 200 ] && [ "$$status" -lt 300 ]; then
          echo "daa-cron endpoint=$$endpoint status=$$status duration_ms=$$duration_ms started_at=$$started_at"
        else
          snippet="$$(head -c 240 "$$body_file" | tr '\n' ' ')"
          echo "daa-cron endpoint=$$endpoint status=$$status duration_ms=$$duration_ms started_at=$$started_at body=$$snippet"
        fi

        rm -f "$$body_file"
        [ "$$status" -ge 200 ] && [ "$$status" -lt 300 ]
        SH
        chmod +x /usr/local/bin/daa-cron-curl
        {
          printf '%s\n' '*/5 * * * * daa-cron-curl /api/daa/cron/price-refresh'
          printf '%s\n' '5 0 * * * daa-cron-curl /api/daa/cron/fx-refresh'
          printf '%s\n' '25 0 * * * daa-cron-curl /api/daa/cron/fundamentals-refresh'
          printf '%s\n' '7,37 * * * * daa-cron-curl /api/daa/cron/news-refresh'
          printf '%s\n' '17,47 * * * * daa-cron-curl /api/daa/cron/market-indicators-refresh'
          printf '%s\n' '20 0 * * * daa-cron-curl /api/daa/cron/cache-cleanup'
          printf '%s\n' '2 * * * * daa-cron-curl /api/daa/cron/daily-analysis'
          printf '%s\n' '3 * * * 1-5 daa-cron-curl /api/daa/cron/drift-check'
          printf '%s\n' '8 8 * * * daa-cron-curl /api/daa/cron/hf-ingest'
          printf '%s\n' '33 1 * * * daa-cron-curl /api/daa/cron/dividend-refresh'
          printf '%s\n' '10,40 * * * * daa-cron-curl /api/daa/cron/health-check'
          printf '%s\n' '23 * * * * daa-cron-curl /api/daa/cron/cognitive-agent'
          printf '%s\n' '43 3 * * * daa-cron-curl /api/daa/cron/entity-backfill'
        } > /etc/crontabs/root
        crond -f -L /dev/stdout

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=daa
      - POSTGRES_PASSWORD=daa
      - POSTGRES_DB=daa
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - daa-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  daa-postgres-data:
  daa-ollama-data:
