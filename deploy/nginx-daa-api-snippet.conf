# Nginx snippet (example)

# /daa handled elsewhere (Next.js app router pages).
# This snippet wires:
# - /daa-api/* -> Python engine
# - /api/daa/* -> Next.js API routes (so the Step4/5 UI can call POST /api/daa/rebalance/simulate)

location ^~ /daa-api/ {
  proxy_pass http://127.0.0.1:18000/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# IMPORTANT: without this, /api/* may be routed elsewhere on the VPS and the v0 UI will 404.
location ^~ /api/daa/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
